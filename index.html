<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exocortex 2130 | Nightly Ops</title>
    <link rel="stylesheet" href="exo.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="title-block">
                <h1>EXOCORTEX <span class="year">2130</span></h1>
                <p class="subtitle">Nightly Operations Console</p>
            </div>
            <div class="status-block">
                <div class="current-time" id="currentTime">--:--</div>
                <div class="session-stats">
                    <span class="stat"><span class="stat-value" id="logCount">0</span> logs</span>
                    <span class="stat"><span class="stat-value" id="activePersonas">0</span>/150 active</span>
                </div>
            </div>
        </header>

        <div class="phase-indicator">
            <div class="phase family" id="phaseFamily">
                <span class="phase-icon">🦙</span>
                <span class="phase-name">Family · Food · Llamas</span>
                <span class="phase-time">6PM - 9PM</span>
            </div>
            <div class="phase exo" id="phaseExo">
                <span class="phase-icon">🧠</span>
                <span class="phase-name">Exocortex Build</span>
                <span class="phase-time">9PM - 12AM</span>
            </div>
        </div>

        <main class="main-grid">
            <!-- Timeline Column -->
            <section class="timeline-section">
                <h2 class="section-title">Tonight's Timeline</h2>
                <div class="timeline" id="timeline">
                    <!-- Generated by JS -->
                </div>
            </section>

            <!-- Log Entry Column -->
            <section class="log-section">
                <h2 class="section-title">Log Improvement</h2>
                
                <div class="log-form">
                    <div class="category-selector">
                        <button class="cat-btn dev" data-category="dev">
                            <span class="cat-icon">⚡</span>
                            <span class="cat-label">DEV</span>
                        </button>
                        <button class="cat-btn ops" data-category="ops">
                            <span class="cat-icon">🔧</span>
                            <span class="cat-label">OPS</span>
                        </button>
                        <button class="cat-btn sales" data-category="sales">
                            <span class="cat-icon">📡</span>
                            <span class="cat-label">SALES</span>
                        </button>
                    </div>

                    <div class="persona-selector">
                        <label>Orchestrating Personas:</label>
                        <div class="persona-grid" id="personaGrid">
                            <!-- Quick persona tags -->
                        </div>
                        <input type="text" id="personaInput" placeholder="Add persona (e.g., Orin, Emi, libphext...)" class="persona-input">
                    </div>

                    <textarea id="logEntry" class="log-textarea" placeholder="What improved in the last 15 minutes?&#10;&#10;Be specific. Ship something. Move the needle."></textarea>
                    
                    <div class="log-actions">
                        <button class="btn-log" id="submitLog">
                            <span class="btn-text">LOG IMPROVEMENT</span>
                            <span class="btn-streak" id="streakIndicator"></span>
                        </button>
                    </div>
                </div>

                <div class="tonight-logs" id="tonightLogs">
                    <h3>Tonight's Progress</h3>
                    <div class="logs-list" id="logsList">
                        <!-- Logged entries appear here -->
                    </div>
                </div>
            </section>

            <!-- Stats Column -->
            <section class="stats-section">
                <h2 class="section-title">Distribution</h2>
                
                <div class="distribution-bars">
                    <div class="dist-bar">
                        <div class="dist-label">DEV</div>
                        <div class="dist-track">
                            <div class="dist-fill dev" id="devBar" style="width: 0%"></div>
                        </div>
                        <div class="dist-value" id="devCount">0</div>
                    </div>
                    <div class="dist-bar">
                        <div class="dist-label">OPS</div>
                        <div class="dist-track">
                            <div class="dist-fill ops" id="opsBar" style="width: 0%"></div>
                        </div>
                        <div class="dist-value" id="opsCount">0</div>
                    </div>
                    <div class="dist-bar">
                        <div class="dist-label">SALES</div>
                        <div class="dist-track">
                            <div class="dist-fill sales" id="salesBar" style="width: 0%"></div>
                        </div>
                        <div class="dist-value" id="salesCount">0</div>
                    </div>
                </div>

                <div class="weekly-overview">
                    <h3>This Week</h3>
                    <div class="week-grid" id="weekGrid">
                        <!-- Mon-Sun mini view -->
                    </div>
                    <div class="week-total">
                        <span class="week-hours" id="weekHours">0</span> / 15-20 hrs
                    </div>
                </div>

                <div class="motivation-block" id="motivationBlock">
                    <div class="quote" id="motivationQuote"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-left">
                <span class="tessera-badge">Tessera Day <span id="tesseraDay">735</span>+</span>
            </div>
            <div class="footer-center">
                <span class="mantra">Build the future from 2130</span>
            </div>
            <div class="footer-right">
                <button class="btn-export" id="exportBtn">Export Session</button>
            </div>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script src="exo.js"></script>
</body>
</html>
