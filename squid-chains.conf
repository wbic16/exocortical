# squid-chains.conf — one Squid proxy per USB4 chain.
# Source this file from bash. Do not execute tb-setup.sh from here.
# shellcheck shell=bash
#
# Chain R uses proxy host 10.53.R.1 (the C=1 node). Chain 7 has no proxy.
# The node's own chain comes from its tbfab address, not from a copy of TB_MAP.

if [[ -z "${BASH_VERSION:-}" ]]; then
  echo "squid-chains.conf must be sourced from bash" >&2
  # shellcheck disable=SC2317
  return 1 2>/dev/null || exit 1
fi

# Chains that run a caching proxy. Chain 7 is intentionally absent.
SQUID_CHAINS=(1 2 3 4 5 6)

declare -A SQUID_CHAIN_HOST=(
  [1]=ni-knight
  [2]=orchid-flow
  [3]=plain-view
  [4]=aletheia-core
  [5]=aurora-continuum
  [6]=yeet-max
)

# Applied wherever a proxy is actually selected. CIDR entries are required
# so node-to-node (10.53/16) and tailnet (100.64/10) traffic stay direct.
# shellcheck disable=SC2034 # sourced API used by the squid scripts
SQUID_NO_PROXY_LIST="localhost,127.0.0.1,.ts.net,10.0.0.0/8,100.64.0.0/10"
# shellcheck disable=SC2034
SQUID_HTTP_PORT=3128
# shellcheck disable=SC2034
SQUID_SSL_PORT=3129

squid_proxy_ip_for_chain() {
  local chain="$1"
  if [[ -z "${SQUID_CHAIN_HOST[$chain]+x}" ]]; then
    return 1
  fi
  printf '10.53.%s.1\n' "$chain"
}

squid_proxy_host_for_chain() {
  local chain="$1"
  if [[ -z "${SQUID_CHAIN_HOST[$chain]+x}" ]]; then
    return 1
  fi
  printf '%s\n' "${SQUID_CHAIN_HOST[$chain]}"
}

squid_is_proxy_host() {
  local host="$1" chain
  for chain in "${SQUID_CHAINS[@]}"; do
    if [[ "${SQUID_CHAIN_HOST[$chain]}" == "$host" ]]; then
      return 0
    fi
  done
  return 1
}

squid_chain_from_ip() {
  local ip="$1"
  if [[ "$ip" =~ ^10\.53\.([0-9]+)\.[0-9]+$ ]]; then
    printf '%s\n' "${BASH_REMATCH[1]}"
    return 0
  fi
  return 1
}

# First IPv4 address on the thunderbolt bridge, without the prefix length.
squid_tbfab_ipv4() {
  ip -4 -o addr show tbfab 2>/dev/null | awk '{print $4}' | head -n1 | cut -d/ -f1
}

squid_tb_setup_path() {
  local dir
  dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
  if [[ -f "${dir}/tb-setup.sh" ]]; then
    printf '%s\n' "${dir}/tb-setup.sh"
    return 0
  fi
  if [[ -f /source/exocortical/tb-setup.sh ]]; then
    printf '%s\n' /source/exocortical/tb-setup.sh
    return 0
  fi
  return 1
}

# This node's chain (the R in 10.53.R.C).
# Prefer the live tbfab address. Fall back to the TB_MAP line for this
# hostname in tb-setup.sh. Never source tb-setup.sh (it reconfigures links).
squid_detect_chain() {
  local ip line host tb
  ip="$(squid_tbfab_ipv4 || true)"
  if [[ -n "$ip" ]] && squid_chain_from_ip "$ip" >/dev/null; then
    squid_chain_from_ip "$ip"
    return 0
  fi
  host="$(hostname -s)"
  tb="$(squid_tb_setup_path)" || return 1
  line="$(grep -E "^[[:space:]]*\[${host}\]=10\\.53\\." "$tb" | head -n1 || true)"
  if [[ "$line" =~ 10\.53\.([0-9]+)\.[0-9]+ ]]; then
    printf '%s\n' "${BASH_REMATCH[1]}"
    return 0
  fi
  return 1
}

# "hostname ip" for every TB_MAP entry, sorted by chain then position.
squid_tb_map_entries() {
  local tb
  tb="$(squid_tb_setup_path)" || return 1
  sed -n 's/^[[:space:]]*\[\([A-Za-z0-9-]*\)\]=\(10\.53\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1 \2/p' "$tb" \
    | sort -t. -k3,3n -k4,4n
}

squid_have_systemd() {
  [[ -S /run/systemd/private ]]
}

if [[ "${BASH_SOURCE[0]}" == "$0" ]]; then
  chain=""
  for chain in "${SQUID_CHAINS[@]}"; do
    printf 'chain %s\t%s\t%s\n' \
      "$chain" \
      "${SQUID_CHAIN_HOST[$chain]}" \
      "$(squid_proxy_ip_for_chain "$chain")"
  done
  if this_chain="$(squid_detect_chain)"; then
    printf 'this-node chain %s\n' "$this_chain"
  else
    printf 'this-node chain unknown\n'
  fi
fi
